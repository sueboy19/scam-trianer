# ============================================
# 正式環境 docker-compose（單容器，Coolify 部署用）
# ============================================
# 用途：Coolify 讀取此檔部署到正式機
# 特點：單一容器（Express 同時 serve API + 靜態 Vue）、低資源、有 healthcheck
#
# Coolify 部署步驟：
#   1. 連結 Git repo，Build Pack 選 Docker Compose，Compose Path 指到此檔
#   2. Environment Variables 填入所有 secrets（見 .env.example）
#   3. Domains 設 https://你的網域，綁到 app service 的 port 3000
#   4. 確認 Storages 有 /app/data 的 persistent volume（或靠下方 named volume）
#   5. DNS A record 指向 VM IP → 部署（Traefik 自動處理 HTTPS）

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${COOLIFY_CONTAINER_NAME:-scam-trainer}
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      # 不設 NODE_OPTIONS=--max-old-space-size：讓 Node 20+ 依容器 cgroup 限制
      # 自動偵測 heap 上限（手動設會覆蓋自動偵測，反而更差）。
      # better-sqlite3 的 native 記憶體不在 V8 heap 內，需靠下方 memory limit 預留空間。
      - PORT=3000
      - DB_PATH=/app/data/app.db
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET must be set}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:?BETTER_AUTH_URL must be set}
      - CLIENT_URL=${CLIENT_URL:-${BETTER_AUTH_URL}}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - FACEBOOK_CLIENT_ID=${FACEBOOK_CLIENT_ID:-}
      - FACEBOOK_CLIENT_SECRET=${FACEBOOK_CLIENT_SECRET:-}
      - LINE_CHANNEL_ID=${LINE_CHANNEL_ID:-}
      - LINE_CHANNEL_SECRET=${LINE_CHANNEL_SECRET:-}
      - INSTAGRAM_CLIENT_ID=${INSTAGRAM_CLIENT_ID:-}
      - INSTAGRAM_CLIENT_SECRET=${INSTAGRAM_CLIENT_SECRET:-}
    volumes:
      - sqlite_data:/app/data
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      # 冷啟動需載入 better-sqlite3 native binding + Better Auth + schema + seed，
      # 首次/映像檔冷時可能接近 30s；拉長 start_period 避免被誤判 unhealthy 觸發重啟循環。
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          # native(sqlite) + V8 heap + 靜態檔需足夠空間；512M 對 2GB+ VM 無負擔，
          # 且能吸收 OAuth/seed 尖峰，避免 OOM killed。
          memory: 512M
        reservations:
          memory: 128M

volumes:
  sqlite_data:
